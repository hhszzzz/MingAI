services:
  mcp:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    image: taibu-mcp:latest
    container_name: taibu-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3001"
      MCP_HOST: "0.0.0.0"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      MCP_MAX_SESSIONS: "${MCP_MAX_SESSIONS:-1000}"
      MCP_SESSION_TTL_MS: "${MCP_SESSION_TTL_MS:-1800000}"
      MCP_SESSION_IDLE_MS: "${MCP_SESSION_IDLE_MS:-600000}"
      MCP_MAX_SESSIONS_PER_IP: "${MCP_MAX_SESSIONS_PER_IP:-20}"
      MCP_RATE_LIMIT_PER_MINUTE: "${MCP_RATE_LIMIT_PER_MINUTE:-120}"
      MCP_MAX_SSE_PER_IP: "${MCP_MAX_SSE_PER_IP:-3}"
      MCP_TRUST_PROXY: "${MCP_TRUST_PROXY:-false}"
      MCP_REQUEST_LOG: "${MCP_REQUEST_LOG:-false}"
    ports:
      - "${MCP_PORT:-3001}:3001"
